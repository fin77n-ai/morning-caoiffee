name: Telegram Morning Digest ☕

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 07:00 北京 / 08:00 东京
  workflow_dispatch:
    inputs:
      preview:
        description: 'Generate a preview without sending or updating history'
        type: boolean
        default: true

concurrency:
  group: telegram-digest
  cancel-in-progress: false

permissions:
  contents: write   # 发送后把 data/sent-history.json 提交回仓库（跨天反重复账本）

jobs:
  send-telegram-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run check && npm test

      - name: Generate preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/telegram-digest.js

      - name: Generate and send Telegram digest
        if: github.event_name != 'workflow_dispatch' || !inputs.preview
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test "$GITHUB_REF_NAME" = main
          node scripts/send-telegram-digest.js

      - name: Persist sent history
        if: success() && (github.event_name != 'workflow_dispatch' || !inputs.preview)
        run: |
          git config user.name "morning-caoiffee-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent-history.json data/story-history.json
          if git diff --cached --quiet; then
            echo "No sent-history changes to commit."
          else
            git commit -m "chore: record sent history"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Save readable preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-preview
          path: work/telegram-preview/
          retention-days: 14
